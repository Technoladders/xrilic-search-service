version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# xrilic-search-service
# Server path: /home/deploy/apps/xrilic-search-service/docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────

networks:
  zivelogin-network-prod:
    external: true

services:
  xrilic-search-service:
    image: xrilictechnologies/xrilic-search-service:${DOCKER_TAG:-prod-latest}
    container_name: xrilic-search-service
    restart: unless-stopped

    networks:
      - zivelogin-network-prod

    ports:
      - "8009:8000"      # host:container — Nginx Proxy Manager routes externally

    environment:
      TYPESENSE_HOST:        typesense          # container name on same network
      TYPESENSE_PORT:        "8108"
      TYPESENSE_API_KEY:     ${TYPESENSE_API_KEY}
      SUPABASE_URL:          ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY:  ${SUPABASE_SERVICE_KEY}
      WEBHOOK_SECRET:        ${WEBHOOK_SECRET}
      ADMIN_SECRET:          ${ADMIN_SECRET}
      POLL_INTERVAL_SEC:     "60"
      PUBLIC_BASE_URL:       "https://sync.xrilic.ai"   # used to build /mc/avatar/<id> links; matches the Nginx Proxy Manager route below
      
      # Master Candidates
      MC_INGEST_ENABLED:     "false"
      MC_INDEX_ENABLED:      "true"
      MC_POLL_INTERVAL_SEC:  "60"
      MC_BATCH_SIZE:         "500"
      MC_COLLECTION_NAME:    "master_candidates_v1"

      # Master Candidates -- portal_a backfill (separate module, see
      # sync_service/master_candidates/backfill/). Auto-resume defaults on:
      # a running backfill must survive a container restart and keep going
      # until it finishes or a superadmin explicitly pauses/stops it.
      MC_BACKFILL_BATCH_SIZE:  "500"
      MC_BACKFILL_CONCURRENCY: "20"
      MC_BACKFILL_AUTO_RESUME: "true"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    depends_on:
      - typesense

  # ── Typesense (co-deployed in same compose file) ──────────────────────────
  typesense:
    image: typesense/typesense:27.1
    container_name: typesense
    restart: unless-stopped
    networks:
      - zivelogin-network-prod
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY:   ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR:  /data
      TYPESENSE_ENABLE_CORS: "true"
      TYPESENSE_CORS_DOMAINS: "*"
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8108 && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  typesense-data:
    driver: local