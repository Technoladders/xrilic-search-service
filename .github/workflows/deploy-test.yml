name: Deploy xrilic-search-service (TEST)

# Test stack only: sync-test.xrilic.ai / search-test.xrilic.ai.
# Never touches the production stack in /home/deploy/apps/xrilic-search-service
# (separate directory, compose project, containers, volume and image tag).

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-search-test
  cancel-in-progress: false

env:
  DOCKER_IMAGE:   xrilictechnologies/xrilic-search-service
  DOCKER_TAG:     test-latest
  DEPLOY_PATH:    /home/deploy/apps/xrilic-search-service-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Docker Hub login ───────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. Set up buildx ─────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build and push ─────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha,scope=test
          cache-to:   type=gha,mode=max,scope=test

      # ── 5. Make sure the deploy dir exists ───────────────────────────────
      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      # ── 6. Copy the TEST compose file to server ──────────────────────────
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   docker-compose.test.yml
          target:   ${{ env.DEPLOY_PATH }}
          timeout: 120s
          command_timeout: 20m

      # ── 7. Deploy ─────────────────────────────────────────────────────────
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            mv -f docker-compose.test.yml docker-compose.yml

            echo "→ Pulling latest images..."
            docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            docker pull typesense/typesense:27.1

            echo "→ Writing .env (TEST secrets)..."
            echo "DOCKER_TAG=${{ env.DOCKER_TAG }}" > .env
            echo "TYPESENSE_API_KEY=${{ secrets.TYPESENSE_API_KEY_TEST }}" >> .env
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
            echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
            echo "WEBHOOK_SECRET=${{ secrets.SEARCH_WEBHOOK_SECRET_TEST }}" >> .env
            echo "ADMIN_SECRET=${{ secrets.SEARCH_ADMIN_SECRET_TEST }}" >> .env

            # Test Typesense: started on first deploy, left running afterwards
            # (no-op when already up with unchanged config).
            echo "→ Ensuring typesense-test is up..."
            docker compose up -d typesense-test

            # Only the API container is recreated on each push.
            echo "→ Recreating xrilic-search-service-test..."
            docker compose up -d --no-deps --force-recreate xrilic-search-service-test

            echo "→ Pruning dangling images..."
            docker image prune -f

            echo "✓ xrilic-search-service TEST deployed"
